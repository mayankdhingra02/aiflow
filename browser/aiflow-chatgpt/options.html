<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aiflow ChatGPT Handoff</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 620px;
      margin: 40px auto;
      padding: 0 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-family: monospace;
    }

    button {
      margin-top: 12px;
      padding: 7px 14px;
    }

    #status {
      margin-top: 12px;
    }

    #blocked {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #ddd;
    }

    code {
      font-family: monospace;
    }
  </style>
</head>

<body>
  <h1>Aiflow ChatGPT Handoff</h1>

  <p>
    Paste the token from
    <code>
      ~/Library/Application Support/Aiflow/handoff-token
    </code>.
  </p>

  <label for="token">
    Handoff token
  </label>

  <input
    id="token"
    type="password"
    autocomplete="off"
    spellcheck="false"
  >

  <button id="save">
    Save token
  </button>

  <div id="status"></div>

  <section id="blocked">
    <h2>Blocked delivery</h2>

    <p id="blocked-status">
      None.
    </p>

    <button id="clear-blocked">
      Clear blocked delivery
    </button>
  </section>

  <script
    type="module"
    src="options.js"
  ></script>
</body>
</html>
